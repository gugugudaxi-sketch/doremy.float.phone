name: Build Android Shell APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["android-shell/**", ".github/workflows/android-shell.yml", "scripts/*android*.py"]

jobs:
  build:
    runs-on: ubuntu-latest
    # 固定签名：仅从仓库 Secret 读取私钥，证书指纹不匹配时停止出包
    env:
      SHELL_SIGNING_BUNDLE: ${{ secrets.SHELL_SIGNING_BUNDLE }}
      SHELL_SITE_URL: ${{ secrets.SHELL_SITE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Gradle 版本必须与根 build.gradle 里的 AGP 匹配：AGP 8.9 要求
      # Gradle 8.11.1 及以上。这两处是一对，改一处不改另一处必然失败。
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.11.1"

      # Compilation is useful even before the signing secret is configured.
      - name: Compile Android sources
        env:
          SHELL_SITE_URL: https://example.invalid
        run: gradle -p android-shell compileDebugKotlin compileReleaseKotlin

      - name: Prepare fixed signing certificate
        run: python3 scripts/prepare-android-signing.py

      - name: Validate private site configuration
        shell: bash
        run: |
          python3 - <<'PYCONFIG'
          import os, urllib.parse
          value = os.environ.get("SHELL_SITE_URL", "")
          parsed = urllib.parse.urlparse(value)
          if parsed.scheme != "https" or not parsed.hostname or parsed.username or parsed.password or parsed.query or parsed.fragment:
              raise SystemExit("Configure the SHELL_SITE_URL repository secret with an HTTPS site URL.")
          PYCONFIG

      - name: Build APKs
        run: gradle -p android-shell assembleDebug assembleRelease

      - name: Verify APK signing certificates
        shell: bash
        run: |
          python3 scripts/verify-android-apks.py

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: float-shell-debug
          path: android-shell/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: float-shell-release
          path: android-shell/app/build/outputs/apk/release/*.apk
