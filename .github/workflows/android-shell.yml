name: Build Android Shell APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["android-shell/**", ".github/workflows/android-shell.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    # 可选签名：仓库 Secrets 配置了 SHELL_KEYSTORE_BASE64 等四项时产出已签名 release
    env:
      SHELL_KEYSTORE_BASE64: ${{ secrets.SHELL_KEYSTORE_BASE64 }}
      SHELL_KEYSTORE_PASSWORD: ${{ secrets.SHELL_KEYSTORE_PASSWORD }}
      SHELL_KEY_ALIAS: ${{ secrets.SHELL_KEY_ALIAS }}
      SHELL_KEY_PASSWORD: ${{ secrets.SHELL_KEY_PASSWORD }}
      SHELL_SITE_URL: ${{ secrets.SHELL_SITE_URL }}
    steps:
      - name: Validate private site configuration
        shell: bash
        run: |
          python3 - <<'PYCONFIG'
          import os, urllib.parse
          value = os.environ.get("SHELL_SITE_URL", "")
          parsed = urllib.parse.urlparse(value)
          if parsed.scheme != "https" or not parsed.hostname or parsed.username or parsed.password or parsed.query or parsed.fragment:
              raise SystemExit("Configure the SHELL_SITE_URL repository secret with an HTTPS site URL.")
          PYCONFIG

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Gradle 版本必须与根 build.gradle 里的 AGP 匹配：AGP 8.9 要求
      # Gradle 8.11.1 及以上。这两处是一对，改一处不改另一处必然失败。
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.11.1"

      - name: Decode keystore (optional)
        if: ${{ env.SHELL_KEYSTORE_BASE64 != '' }}
        run: |
          echo "$SHELL_KEYSTORE_BASE64" | base64 -d > /tmp/shell.keystore
          echo "SHELL_KEYSTORE_FILE=/tmp/shell.keystore" >> "$GITHUB_ENV"

      - name: Build APKs
        run: gradle -p android-shell assembleDebug assembleRelease

      - name: Report signing mode
        shell: bash
        run: |
          if [ -n "$SHELL_KEYSTORE_BASE64" ]; then
            echo "Existing configured keystore used; package remains app.floatphone.shell." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Debug APK uses this runner's temporary debug certificate. Compatibility with old installs is NOT guaranteed. Export in-app data before any migration. Release APK is unsigned; no new production key was generated." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: float-shell-debug
          path: android-shell/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: float-shell-release
          path: android-shell/app/build/outputs/apk/release/*.apk
