name: One-time approved privacy cleanup
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/privacy-cleanup.yml"]
permissions:
  contents: write
  actions: write
jobs:
  scrub:
    if: github.repository == 'gugugudaxi-sketch/doremy.float.phone' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rewrite approved private-site history
        env:
          PUBLISH_CLEANUP: 'true'
        run: python3 scripts/scrub-private-site-history.py
      - name: Remove the two obsolete public build records
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for run_id in 38900819385 38902649682; do
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$run_id"
          done
      - name: Record completion
        run: echo "Historical private deployment defaults and the two obsolete public build records were removed. The current source tree and the latest APK artifacts were preserved." >> "$GITHUB_STEP_SUMMARY"
